name: GEMSGUI

channels:
  - conda-forge
  - defaults

dependencies:
  - cmake
  - git
  - ccache
  - gcc_linux-64  # [linux]
  - gxx_linux-64  # [linux]
  - sysroot_linux-64 # [linux]
  - make  # [unix]
  - ninja
  - 7zip  # [win]
  # GEMS3K and Optima are built from the gemshub repositories (.github/scripts/build-gems3k-optima.sh);
  # only what they need is installed here
  - thermofun>=0.5.4
  - spdlog
  - nlohmann_json
  - eigen>=3.4
  - cppzmq
  - mesa-libgl-devel-conda-x86_64 # [unix]
  - qt6-main=6.10.2 # [not win]
  - qt6-charts=6.10.2 # [not win]
  - qt6-main=6.10.2 # [win]
  - qt6-charts=6.10.2 # [win]
  - python>=3.10
  - pytest
