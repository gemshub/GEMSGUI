name: deploy-windows
on:
  push:
    branches:
      - fix_pow_other_bugs
      - project_err1
      - develop_gems3kv5   # TEMPORARY: branch test
  release:
    types:
      - published

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ windows-latest ]
        conda_platform: [ win-64 ]
        artifact_name: [ gemsgui-windows ]

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from CMakeLists.txt
        id: get_version
        uses: DarwinInnovation/cmake-project-version-action@v1.0

      - name: Set deploy name
        id: strings
        shell: bash
        run: >
          echo "deploy-name=GEMS${{ steps.get_version.outputs.version }}" >> "$GITHUB_OUTPUT"

      # TEMPORARY (branch develop_gems3kv5 test): the branch name goes into the package/artifact names
      - name: Set branch suffix
        id: branch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            b="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            echo "suffix=-$b" >> "$GITHUB_OUTPUT"
          fi

      - name: Set deploy dir
        id: strings2
        shell: bash
        run: |
          echo "deploy-output-dir=${{ github.workspace }}/${{ steps.strings.outputs.deploy-name }}/Gems3-app" >> "$GITHUB_OUTPUT"
          echo "deploy-output-name=windows-${{ steps.strings.outputs.deploy-name }}${{ steps.branch.outputs.suffix }}.zip" >> "$GITHUB_OUTPUT"

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: base
          channels: conda-forge

      - name: Configuring Conda Environment
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          conda run -n base python -m conda_devenv

      # TEMPORARY (branch develop_gems3kv5 test): GEMS3K and Optima are built from the gemshub repositories
      # instead of the conda gems3k package; revert together with environment.devenv.yml before merging.
      # conda activate is not hooked into Git Bash on Windows (CONDA_PREFIX stays unset), so the
      # environment is activated from cmd, which the build step below uses as well.
      - name: Build Optima and GEMS3K from the gemshub repositories
        shell: cmd
        env:
          OPTIMA_REF: ${{ vars.OPTIMA_REF || 'optima_develop' }}
          GEMS3K_REF: ${{ vars.GEMS3K_REF || 'develop_optima' }}
        run: |
          call conda activate GEMSGUI || goto :eof
          "C:\Program Files\Git\bin\bash.exe" .github/scripts/build-gems3k-optima.sh || goto :eof

      - name: Building, Testing & Installing GEMSGUI (Windows)
        shell: cmd
        run: |
          call conda activate GEMSGUI || goto :eof
          cp "cmake/qt.conf" "C:\Miniconda\envs\GEMSGUI\Library\lib\qt6\bin" || goto :eof
          rem --- Build and install ---
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ steps.strings2.outputs.deploy-output-dir }} -A x64 -S . -B build  || goto :eof
          cmake --build build --target install --config Release || goto :eof
          D:\a\GEMSGUI\GEMSGUI\build\Release\gems3helpconfig-qhp-generator.exe || goto :eof

      - name: Check deploy
        run: |
          conda activate GEMSGUI
          cd ${{ github.workspace }}/Resources/doc/html
          C:\Miniconda\envs\GEMSGUI\Library\lib\qt6\qhelpgenerator.exe gems3helpconfig.qhcp -o gems3help.qhc
          cp "gems3help.qhc" "${{ github.workspace }}/Resources/help"
          cp "gems3help.qch" "${{ github.workspace }}/Resources/help"
          cd ${{ github.workspace }}/Resources/help
          ls
          cp -r "${{ github.workspace }}/Resources" ${{ steps.strings2.outputs.deploy-output-dir }}
          cp "${{ github.workspace }}/Resources/rungems3.bat" "${{ github.workspace }}/${{ steps.strings.outputs.deploy-name }}"
          cp "${{ github.workspace }}/Resources/README-windows.txt" "${{ github.workspace }}/${{ steps.strings.outputs.deploy-name }}/README.txt"

      # TEMPORARY (branch develop_gems3kv5 test): what this package was built from
      - name: Write build info
        shell: bash
        run: |
          cat > "${{ github.workspace }}/${{ steps.strings.outputs.deploy-name }}/BUILD_INFO.txt" <<EOF
          GEMSGUI branch: ${{ github.ref_name }}
          GEMSGUI commit: ${{ github.sha }}
          GEMS3K:  ${GEMS3K_REF_USED:-?} @ ${GEMS3K_COMMIT:-?}
          Optima:  ${OPTIMA_REF_USED:-?} @ ${OPTIMA_COMMIT:-?}
          EOF

      - name: Create zip archive (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.strings.outputs.deploy-name }}" -DestinationPath "${{ steps.strings2.outputs.deploy-output-name }}"
      
      - name: Upload zip archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.strings.outputs.deploy-name }}${{ steps.branch.outputs.suffix }}
          path: ${{ github.workspace }}/${{ steps.strings2.outputs.deploy-output-name }}

      - name: Upload release asset
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ github.workspace }}/${{ steps.strings2.outputs.deploy-output-name }}
          asset_name: ${{ steps.strings2.outputs.deploy-output-name }}
          asset_content_type: application/zip

