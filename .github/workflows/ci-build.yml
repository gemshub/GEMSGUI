name: ci-build
on:
  push:
    branches:
      - help_generation_ci1
      - master
      - develop_gems3kv5   # TEMPORARY: branch test
  pull_request:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            conda_platform: linux-64
            artifact_name: gemsgui-linux
          - os: windows-latest
            conda_platform: win-64
            artifact_name: gemsgui-windows
          - os: macos-latest
            conda_platform: osx-arm64
            artifact_name: gemsgui-macos

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: base
          channels: conda-forge

      - name: Configuring Conda Environment
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          conda run -n base python -m conda_devenv

      # TEMPORARY (branch develop_gems3kv5 test): GEMS3K and Optima are built from the gemshub repositories
      # instead of the conda gems3k package; revert together with environment.devenv.yml before merging.
      - name: Build Optima and GEMS3K from the gemshub repositories
        if: matrix.os != 'windows-latest'
        shell: bash -el {0}
        env:
          OPTIMA_REF: ${{ vars.OPTIMA_REF || 'optima_develop' }}
          GEMS3K_REF: ${{ vars.GEMS3K_REF || 'develop_optima' }}
        run: |
          conda activate GEMSGUI
          bash .github/scripts/build-gems3k-optima.sh

      # conda activate is not hooked into Git Bash on Windows (CONDA_PREFIX stays unset), so the
      # environment is activated from cmd, which the Windows build step below uses as well.
      - name: Build Optima and GEMS3K from the gemshub repositories (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          OPTIMA_REF: ${{ vars.OPTIMA_REF || 'optima_develop' }}
          GEMS3K_REF: ${{ vars.GEMS3K_REF || 'develop_optima' }}
        run: |
          call conda activate GEMSGUI || goto :eof
          "C:\Program Files\Git\bin\bash.exe" .github/scripts/build-gems3k-optima.sh || goto :eof

      # Linux/macOS use ccache through CMAKE_CXX_COMPILER_LAUNCHER (cmake/modules/CCache.cmake).
      # The Visual Studio generator ignores that launcher, so the Windows build below
      # runs ccache.exe in place of cl.exe through CMAKE_VS_GLOBALS.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-

      - name: Building, Testing & Installing GEMSGUI
        if: matrix.os != 'windows-latest'
        shell: bash -l {0}
        run: |
          conda activate GEMSGUI
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=500M
          mkdir .build && cd .build
          cmake -GNinja .. -DCMAKE_BUILD_TYPE=Release
          ninja
          ccache --show-stats
          cd benchcomp
          ./check-db -d -s . -k

      - name: Building, Testing & Installing GEMSGUI (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call conda activate GEMSGUI || goto :eof
          rem --- Build, no install ---
          if not exist "%CCACHE_DIR%" mkdir "%CCACHE_DIR%"
          ccache --max-size=500M || goto :eof
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH="%CONDA_PREFIX%\Library" -A x64 -S . -B build -DCMAKE_VS_GLOBALS="CLToolExe=ccache.exe;CLToolPath=%CONDA_PREFIX%\Library\bin;TrackFileAccess=false;UseMultiToolTask=true;EnforceProcessCountAcrossBuilds=true" || goto :eof
          setlocal EnableDelayedExpansion
          cmake --build build --config Release -- /m
          if errorlevel 1 (
            for /d %%d in ("C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\*") do set "MSLINK=%%d\bin\Hostx64\x64\link.exe"
            echo --- DIAGNOSTIC: symbols DEFINED in the installed libraries ---
            "!MSLINK!" /dump /linkermember:1 "%CONDA_PREFIX%\Library\lib\GEMS3K-static.lib" | findstr /C:"MoveWorkNodeToArray" /C:"CopyWorkNodeFromArray"
            "!MSLINK!" /dump /linkermember:1 "%CONDA_PREFIX%\Library\lib\GEMS3K.lib" | findstr /C:"MoveWorkNodeToArray" /C:"CopyWorkNodeFromArray"
            echo --- DIAGNOSTIC: libraries given to the linker for process-run ---
            cmake --build build --config Release --target process-run -- /v:d | findstr /I /C:"GEMS3K" /C:"link.exe"
            exit /b 1
          )
          ccache --show-stats

      - name: Check conda
        run: |
          conda config --show
          conda list --show-channel-urls

