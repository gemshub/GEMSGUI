name: ci-build
on:
  push:
    branches:
      - help_generation_ci1
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            conda_platform: linux-64
            artifact_name: gemsgui-linux
          - os: windows-latest
            conda_platform: win-64
            artifact_name: gemsgui-windows
          - os: macos-latest
            conda_platform: osx-arm64
            artifact_name: gemsgui-macos

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: base
          channels: conda-forge

      - name: Configuring Conda Environment
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          conda run -n base python -m conda_devenv

      # ccache cache is only wired up for the Ninja-generator builds below (Linux/macOS):
      # CMAKE_CXX_COMPILER_LAUNCHER (set automatically by cmake/modules/CCache.cmake when
      # ccache is found on PATH) isn't reliably honored by the Visual Studio generator used
      # for the Windows build (`-A x64`), so caching it there would have no effect.
      - name: Cache ccache (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-

      - name: Building, Testing & Installing GEMSGUI
        if: matrix.os != 'windows-latest'
        shell: bash -l {0}
        run: |
          conda activate GEMSGUI
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=500M
          mkdir .build && cd .build
          cmake -GNinja .. -DCMAKE_BUILD_TYPE=Release
          ninja
          ccache --show-stats

      - name: Building, Testing & Installing GEMSGUI (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call conda activate GEMSGUI || goto :eof
          rem --- Build, no install ---
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH="%CONDA_PREFIX%\Library" -A x64 -S . -B build  || goto :eof
          cmake --build build --config Release  || goto :eof

      - name: Check conda
        run: |
          conda config --show
          conda list --show-channel-urls

