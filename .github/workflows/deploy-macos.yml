name: deploy-macos

on:
  push:
    branches:
      - fix_pow_other_bugs
  release:
    types:
      - published

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14 ]
        conda_platform: [ osx-arm64 ]
        artifact_name: [ gemsgui-macos ]

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Version extraction
      # -------------------------
      - name: Get version from CMakeLists.txt
        id: get_version
        uses: DarwinInnovation/cmake-project-version-action@v1.0

      - name: Set deploy name
        id: strings
        shell: bash
        run: echo "deploy-name=GEMS${{ steps.get_version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Set deploy dir
        id: strings2
        shell: bash
        run: |
          echo "deploy-output-dir=${{ github.workspace }}/${{ steps.strings.outputs.deploy-name }}" >> "$GITHUB_OUTPUT"
          echo "deploy-output-name=macos-${{ steps.strings.outputs.deploy-name }}.zip" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Conda environment
      # -------------------------
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: base
          channels: conda-forge

      - name: Configuring Conda Environment
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          conda run -n base python -m conda_devenv
      
      # -------------------------
      # Build & Install
      # -------------------------
      - name: Building, Testing & Installing GEMSGUI
        shell: bash -l {0}
        run: |
          conda activate GEMSGUI
          mkdir .build && cd .build
          cmake -GNinja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=${{ steps.strings2.outputs.deploy-output-dir }}
          ninja
          ./generate_gems3help.sh
          ninja install

      # -------------------------
      # Post-install adjustments
      # -------------------------
      - name: Check deploy
        run: |
          cd ${{ github.workspace }}
          cp -r "Resources" "${{ steps.strings.outputs.deploy-name }}/gem-selektor.app/Contents"
          cp "Resources/rungems3-mac.sh" "${{ steps.strings.outputs.deploy-name }}/rungems3.sh"
          cp "Resources/README-macos.txt" "${{ steps.strings.outputs.deploy-name }}/README.txt"

      - name: Install timeout tool
        run: brew install coreutils

      # -------------------------
      # Verify architecture + smoke test GUI app
      # -------------------------
      - name: Verify runner architecture
        run: |
          echo "uname -m:"
          uname -m
          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: Not running on ARM64 runner"
            exit 1
          fi

      - name: Smoke test GEMSGUI
        run: |
          APP="${{ steps.strings2.outputs.deploy-output-dir }}/gem-selektor.app/Contents/MacOS/gem-selektor"
          set +e
          gtimeout 10 "$APP" -u "$HOME/gems-user-dir"
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 124 ] && [ "$EXIT_CODE" -ne 0 ]; then
            echo "App crashed with exit code $EXIT_CODE"
            exit 1
          fi

      # -------------------------
      # macdeployqt (NO DMG)
      # -------------------------
      - name: Run macdeployqt (no DMG)
        shell: bash -l {0}
        run: |
          conda activate GEMSGUI
          cd "${{ steps.strings2.outputs.deploy-output-dir }}"
          /Users/runner/miniconda3/envs/GEMSGUI/lib/qt6/bin/macdeployqt gem-selektor.app -verbose=2

      # -------------------------
      # Ad-hoc signing
      # -------------------------
      - name: Ad-hoc sign .app bundle
        run: |
          cd "${{ steps.strings2.outputs.deploy-output-dir }}"
          xattr -dr com.apple.quarantine gem-selektor.app || true
          codesign --force --deep --sign - gem-selektor.app
          codesign --verify --deep --strict gem-selektor.app

      # -------------------------
      # Create DMG (signed app inside)
      # -------------------------
      - name: Create DMG
        run: |
          cd "${{ steps.strings2.outputs.deploy-output-dir }}"
          hdiutil create -volname gem-selektor \
            -srcfolder gem-selektor.app \
            -ov -format UDZO gem-selektor.dmg
          mv gem-selektor.dmg "${{ github.workspace }}/macos-${{ steps.strings.outputs.deploy-name }}.dmg"

      # -------------------------
      # ZIP packaging
      #
      # Must use ditto, not zip: plain `zip -r` follows symlinks by default
      # on macOS and copies their targets in place, which flattens the
      # Versions/Current-style symlinks inside each Qt .framework. That
      # mismatches the bundle's embedded CodeResources manifest (which
      # records those entries as symlinks) and invalidates the deep
      # signature applied above - Gatekeeper then reports the app as
      # "damaged" with no "Open Anyway" override, instead of the milder
      # unidentified-developer prompt. ditto preserves symlinks/bundle
      # structure exactly, so the signature survives the round trip.
      # -------------------------
      - name: Create zip archive for GitHub release
        env:
          DEPLOY_NAME: ${{ steps.strings.outputs.deploy-name }}
          DEPLOY_OUTPUT_NAME: ${{ steps.strings2.outputs.deploy-output-name }}
        run: |
          cd ${{ github.workspace }}
          ditto -c -k --keepParent "$DEPLOY_NAME" "$DEPLOY_OUTPUT_NAME"

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.strings.outputs.deploy-name }}-zip
          path: ${{ github.workspace }}/${{ steps.strings2.outputs.deploy-output-name }}

      - name: Upload artifact DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.strings.outputs.deploy-name }}-dmg
          path: ${{ github.workspace }}/macos-${{ steps.strings.outputs.deploy-name }}.dmg

      # -------------------------
      # Release assets
      # -------------------------
      - name: Upload ZIP release asset
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ github.workspace }}/${{ steps.strings2.outputs.deploy-output-name }}
          asset_name: ${{ steps.strings2.outputs.deploy-output-name }}
          asset_content_type: application/zip

      - name: Upload DMG release asset
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ github.workspace }}/macos-${{ steps.strings.outputs.deploy-name }}.dmg
          asset_name: macos-${{ steps.strings.outputs.deploy-name }}.dmg
          asset_content_type: application/x-apple-diskimage
